name: Build and Publish Docker Image

on:
  workflow_call:
    inputs:
      tag_name:
        description: Release tag created by release-please (e.g. v0.74.0)
        required: false
        type: string
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.sha }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute release tags
        id: release_tags
        shell: bash
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME,,}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          TAG="${{ inputs.tag_name }}"
          if [[ -n "$TAG" ]]; then
            VER="${TAG##*-v}"
            VER="${VER#v}"
            MAJOR_MINOR="${VER%.*}"
            echo "extra_tags=${IMAGE}:${VER},${IMAGE}:${MAJOR_MINOR},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "extra_tags=" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.release_tags.outputs.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Merge metadata and release-please tags
        id: final_tags
        shell: bash
        run: |
          {
            echo 'tags<<EOF'
            echo "${{ steps.meta.outputs.tags }}"
            if [[ -n "${{ steps.release_tags.outputs.extra_tags }}" ]]; then
              echo "${{ steps.release_tags.outputs.extra_tags }}" | tr ',' '\n'
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push native linux/amd64 container image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.final_tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
