name: CI Quality Gates

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-verification:
    name: Release, Link & Anti-Theatre Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Release Verification & Test Theatre Audit
        run: python3 scripts/verify_release.py --audit-tests --ci

  python-quality-and-tests:
    name: Lint, Contract & Coverage Gate (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,dev]"

      - name: Run English-Only Gate
        run: |
          python -m invisible_core.english --selftest
          python -m invisible_core.english

      - name: Run Ruff Check
        run: ruff check src tests scripts

      - name: Verify Modular File Size Limits (<= 500 LOC)
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          bad = []
          for p in list(Path("src/stealth_wrapper").glob("*.py")) + list(Path("tests/wrapper").glob("*.py")):
              lines = len(p.read_text(encoding="utf-8").splitlines())
              if lines > 500:
                  bad.append(f"{p}: {lines} lines > 500")
          if bad:
              print("\n".join(bad), file=sys.stderr)
              sys.exit(1)
          print("All stealth_wrapper source and test files are <= 500 lines.")
          PY

      - name: Run Wrapper Tests with Coverage (>= 80%)
        run: |
          pytest tests/wrapper --cov=stealth_wrapper --cov-report=term-missing --cov-fail-under=80

      - name: Run Full Unit & Upstream Contract Suite
        run: |
          pytest --ignore=tests/test_release_pages.py --ignore=tests/test_version_is_not_taken.py

  docker-smoke:
    name: Native Container Build & Healthz Smoke Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [release-verification, python-quality-and-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build native linux/amd64 Docker image
        run: docker build --platform linux/amd64 -t playwright-invisible-mcp:ci .

      - name: Start container & probe /healthz
        run: |
          docker run -d --name pw-ci-smoke -p 18000:8000 playwright-invisible-mcp:ci
          trap 'docker logs pw-ci-smoke || true; docker rm -f pw-ci-smoke || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/healthz; then
              echo ""
              echo "Container /healthz check passed!"
              exit 0
            fi
            sleep 1
          done
          echo "Container /healthz check timed out!" >&2
          exit 1

  e2e:
    name: Real Engine E2E & UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [python-quality-and-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Fetch engine and run E2E + UI suites
        run: |
          export STEALTHFOX_BINARY="$(invisible-playwright fetch | tail -n 1)"
          python -m pytest -q -m e2e tests/mcp_server
          python -m pytest -q -m ui
