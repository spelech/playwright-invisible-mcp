version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pip-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 30
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-pip)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 30
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-actions)"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 30
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-docker)"
